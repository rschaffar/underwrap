[package]
name = "underwrap-backend"
description = "underwrap backend daemon — HTTPS service that holds secrets, serves the runtime mTLS API, and hosts the admin SPA + JSON API"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
name = "underwrap_backend"
path = "src/lib.rs"

[[bin]]
name = "underwrap-backend"
path = "src/main.rs"

[dependencies]
libc = { workspace = true }
underwrap-protocol = { workspace = true }
underwrap-backend-store = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
clap = { workspace = true }
axum = { workspace = true }
tower = { workspace = true }
hyper = { workspace = true }
hyper-util = { workspace = true }
http-body-util = { workspace = true }
rustls = { workspace = true }
tokio-rustls = { workspace = true }
rustls-pemfile = { workspace = true }
base64 = { workspace = true }
hex = { workspace = true }
sha2 = "0.10"
rust-embed = { version = "8", features = ["interpolate-folder-path"] }
mime_guess = "2"
rand = { workspace = true }
argon2 = "0.5"
tower-sessions = { workspace = true }
axum-login = { workspace = true }
axum_csrf = { workspace = true }
utoipa = { workspace = true }
utoipa-axum = { workspace = true }

tempfile = { workspace = true }

[dev-dependencies]
rcgen = { workspace = true }
