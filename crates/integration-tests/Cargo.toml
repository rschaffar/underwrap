[package]
name = "integration-tests"
description = "End-to-end integration tests for underwrap"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
include = [
  "src/**",
  "testdata/**",
  "Cargo.toml",
]

# This crate contains only tests — no library or binary.
[lib]
name = "integration_tests"
path = "src/lib.rs"

[dependencies]
underwrap-protocol = { workspace = true }
underwrap-backend-store = { workspace = true }
underwrapd = { path = "../underwrapd" }
underwrap-backend = { path = "../underwrap-backend" }
tokio = { workspace = true }
serde_json = { workspace = true }
serde-saphyr = { workspace = true }
anyhow = { workspace = true }
reqwest = { workspace = true }
rustls = { workspace = true }
libc = { workspace = true }
base64 = { workspace = true }
tempfile = "3"
percent-encoding = "2"
