[package]
name = "underwrap-ns"
description = "Namespace supervisor — authenticates the daemon handoff, projects resources, and executes a dedicated-UID target"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "underwrap-ns"
path = "src/main.rs"

[dependencies]
underwrap-protocol = { path = "../underwrap-protocol", default-features = false, features = ["local-abi"] }
libc = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
