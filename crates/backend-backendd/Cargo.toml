[package]
name = "backend-backendd"
description = "underwrap backend daemon — holds secrets, serves them over Unix socket (for SSH tunnel)"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "underwrap_backendd"
path = "src/lib.rs"

[[bin]]
name = "underwrap-backendd"
path = "src/main.rs"

[dependencies]
libc = { workspace = true }
shared-protocol = { workspace = true }
shared-store = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
clap = { workspace = true }
reqwest = { workspace = true }
axum = { workspace = true }
hyper = { workspace = true }
hyper-util = { workspace = true }
http-body-util = { workspace = true }
bytes = { workspace = true }
rustls = { workspace = true }
tokio-rustls = { workspace = true }
rustls-pemfile = { workspace = true }
x509-parser = { workspace = true }
base64 = { workspace = true }
subtle = "2"
sha2 = "0.10"

[dev-dependencies]
tempfile = { workspace = true }
