[package]
name = "underwrap-admin-ui"
description = "Operator UI for the underwrap central backend — manage wrapper modes, rules, and grants."
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "underwrap_admin_ui"
path = "src/lib.rs"

[[bin]]
name = "underwrap-admin-ui"
path = "src/main.rs"

[dependencies]
underwrap-protocol = { workspace = true }
anyhow = { workspace = true }
axum = { workspace = true, features = ["form", "query"] }
tokio = { workspace = true }
hyper = { workspace = true }
hyper-util = { workspace = true }
http-body-util = { workspace = true }
bytes = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
clap = { workspace = true }
reqwest = { workspace = true }
base64 = { workspace = true }
rand = { workspace = true }
subtle = "2"
argon2 = "0.5"
hmac = "0.12"
sha2 = "0.10"
cookie = { version = "0.18", features = ["percent-encode"] }

[dev-dependencies]
tempfile = { workspace = true }
underwrap-backendd = { path = "../underwrap-backendd" }
