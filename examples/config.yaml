# Example underwrap daemon configuration.
# Copy to /etc/underwrap/config.yaml or point underwrapd --config at it.
#
# On NixOS, the module generates this automatically.
# On other systems, write this by hand.

sockets:
  control: /run/underwrap/control.sock
  control_mode: "0600"

storage:
  backend: plain
  dir: /var/lib/underwrap/secrets
  # Or encrypted:
  # backend: encrypted
  # dir: /var/lib/underwrap/secrets
  # key_file: /var/lib/underwrap/master.key

wrappers:
  # Each wrapper entry defines one underwrap-facing command.
  # The socket and group together form the authenticated wrapper identity:
  # the socket selects the expected wrapper, and the peer's effective GID
  # must match the configured group for that socket.
  gh-authorized:
    target: /usr/bin/gh
    secret: github/token
    socket: /run/underwrap/gh-authorized.sock
    group: underwrap-gh-authorized  # GID-based identity (setgid wrapper)
    injection:
      mode: env
      variable: GH_TOKEN

  # Agent-facing pattern: point underwrap at your own narrow wrapper in the
  # Nix store, not directly at the full gh CLI. That wrapper can hardcode the
  # repo and allowed subcommand, then call a store-pinned gh internally.
  agent-gh-comment:
    target: /nix/store/...-agent-gh-comment/bin/agent-gh-comment
    secret: github/agent-comment
    socket: /run/underwrap/agent-gh-comment.sock
    group: underwrap-agent-gh-comment
    injection:
      mode: env
      variable: GH_TOKEN

  gws:
    target: /usr/bin/gws
    secret: google/workspace-creds
    socket: /run/underwrap/gws.sock
    group: underwrap-gws
    injection:
      mode: env
      variable: GOOGLE_WORKSPACE_CLI_TOKEN
    derivation: oauth_refresh_to_access_token
    require_unlock: true

  agent-slack:
    target: /usr/bin/slack-cli
    secret: slack/xoxp
    socket: /run/underwrap/agent-slack.sock
    group: underwrap-agent-slack
    injection:
      mode: env
      variable: SLACK_TOKEN

  # Libsecret-enabled wrapper: provides org.freedesktop.secrets inside
  # the PID namespace so gh can store/retrieve tokens via libsecret.
  # Requires dbus package available on the system.
  gh-libsecret:
    target: /usr/bin/gh
    secret: github/bootstrap  # Initial secret (can be empty placeholder)
    socket: /run/underwrap/gh-libsecret.sock
    group: underwrap-gh-libsecret
    libsecret: true            # Enables private D-Bus + Secret Service
    injection:
      mode: env
      variable: GH_UNUSED      # Not used when libsecret handles credentials
    # Environment sanitization: target gets a clean env (no LD_PRELOAD etc).
    # In the NixOS module, use envPassthrough / envSet to add trusted
    # per-wrapper environment entries from root-owned sidecar config.

secrets:
  # Secret entries define metadata and mutability only.
  # Secret values themselves are written later through the control socket.
  github/token:
    mutable: false

  github/agent-comment:
    mutable: false

  github/bootstrap:
    mutable: false

  google/workspace-creds:
    mutable: true

  slack/xoxp:
    mutable: false
