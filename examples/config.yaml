# Example underwrap daemon configuration.
# Copy to /etc/underwrap/config.yaml or point underwrapd --config at it.
#
# On NixOS, the module generates this automatically and forces the client
# credential paths to a per-instance location under the instance state
# dir (/var/lib/underwrap-<instance>/client-<instance>.{pem,key}). The
# operator never wires those paths by hand. On other systems, write this
# by hand and run `underwrap-keygen --instance-config <this file>` to
# populate the credential paths below.

backend:
  url: https://backend.example.internal:8443
  ca_file: /etc/underwrap/backend-ca.pem
  client_cert_file: /var/lib/underwrap/client.pem
  client_key_file: /var/lib/underwrap/client.key

wrappers:
  # Each wrapper entry defines one underwrap-facing command.
  # The socket and group together form the authenticated wrapper identity:
  # the socket selects the expected wrapper, and the peer's effective GID
  # must match the configured group for that socket.
  #
  # Every backend resource always has three slots:
  #   <resource>/env/*
  #   <resource>/files/*
  #   <resource>/libsecret/*
  #
  # The wrapper config only decides which slots to project into the target.
  gh-authorized:
    target: /usr/bin/gh
    socket: /run/underwrap/gh-authorized.sock
    group: underwrap-gh-authorized
    resources:
      github/token:
        env: true

  # Agent-facing pattern: point underwrap at your own narrow wrapper in the
  # Nix store, not directly at the full gh CLI. That wrapper can hardcode the
  # repo and allowed subcommand, then call a store-pinned gh internally.
  agent-gh-comment:
    target: /nix/store/...-agent-gh-comment/bin/agent-gh-comment
    socket: /run/underwrap/agent-gh-comment.sock
    group: underwrap-agent-gh-comment
    resources:
      github/token:
        env: true

  agent-slack:
    target: /usr/bin/slack-cli
    socket: /run/underwrap/agent-slack.sock
    group: underwrap-agent-slack
    resources:
      slack/xoxp:
        env: true

  # Libsecret-backed gh wrappers can share one backend resource.
  gh-auth:
    target: /usr/bin/gh
    socket: /run/underwrap/gh-auth.sock
    group: underwrap-gh-auth
    resources:
      github/gh:
        libsecret: true

  gh-pr:
    target: /nix/store/...-gh-pr-helper/bin/gh-pr-helper
    socket: /run/underwrap/gh-pr.sock
    group: underwrap-gh-pr
    resources:
      github/gh:
        libsecret: true

  # A tool that persists backend-managed credential state in a directory tree.
  gws-auth:
    target: /usr/bin/gws
    socket: /run/underwrap/gws-auth.sock
    group: underwrap-gws-auth
    resources:
      gws/state:
        files:
          # One or more target-home-relative mount paths. The same backend
          # resource is bind-mounted at every entry; writes are serialized
          # through a single daemon channel so two mount points can never
          # race against each other.
          #
          # The namespace mount is always read-write for the target, even
          # when the backend grant denies writes. The backend is the sole
          # write authority: any modifications attempted on a read-only
          # grant are dropped at the end-of-run writeback and the wrapper
          # emits one journal event + one stderr line per affected
          # resource. Set `UNDERWRAP_SUPPRESS_READONLY_WARNING=1` on the
          # wrapper invocation to silence the stderr line (the journal
          # event is always emitted).
          paths:
            - .config/gws
