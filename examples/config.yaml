# Example underwrap daemon configuration.
# Copy to /etc/underwrap/config.yaml or point underwrapd --config at it.
#
# On NixOS, the module generates this automatically.
# On other systems, write this by hand.

sockets:
  control: /run/underwrap/control.sock
  control_mode: "0600"

storage:
  backend: plain
  dir: /var/lib/underwrap/secrets
  # Or encrypted:
  # backend: encrypted
  # dir: /var/lib/underwrap/secrets
  # key_file: /var/lib/underwrap/master.key

credentials:
  # A reusable env-injected token.
  github/token:
    mode: env
    variable: GH_TOKEN

  # A reusable libsecret namespace.
  github/gh:
    mode: libsecret

  slack/xoxp:
    mode: env
    variable: SLACK_TOKEN

wrappers:
  # Each wrapper entry defines one underwrap-facing command.
  # The socket and group together form the authenticated wrapper identity:
  # the socket selects the expected wrapper, and the peer's effective GID
  # must match the configured group for that socket.
  gh-authorized:
    target: /usr/bin/gh
    socket: /run/underwrap/gh-authorized.sock
    group: underwrap-gh-authorized
    use:
      github/token:
        access: read-only

  # Agent-facing pattern: point underwrap at your own narrow wrapper in the
  # Nix store, not directly at the full gh CLI. That wrapper can hardcode the
  # repo and allowed subcommand, then call a store-pinned gh internally.
  agent-gh-comment:
    target: /nix/store/...-agent-gh-comment/bin/agent-gh-comment
    socket: /run/underwrap/agent-gh-comment.sock
    group: underwrap-agent-gh-comment
    use:
      github/token:
        access: read-only

  agent-slack:
    target: /usr/bin/slack-cli
    socket: /run/underwrap/agent-slack.sock
    group: underwrap-agent-slack
    use:
      slack/xoxp:
        access: read-only

  # Libsecret-backed gh wrappers can share one credential namespace while
  # receiving different permissions.
  gh-auth:
    target: /usr/bin/gh
    socket: /run/underwrap/gh-auth.sock
    group: underwrap-gh-auth
    use:
      github/gh:
        access: read-write
    unlock:
      mode: optional
      maxSeconds: 1800

  gh-pr:
    target: /nix/store/...-gh-pr-helper/bin/gh-pr-helper
    socket: /run/underwrap/gh-pr.sock
    group: underwrap-gh-pr
    use:
      github/gh:
        access: read-only
    unlock:
      mode: always
      maxSeconds: 1800
