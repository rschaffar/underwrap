[workspace]
resolver = "2"
members = [
    "crates/underwrap-protocol",
    "crates/underwrapd",
    "crates/underwrapctl",
    "crates/underwrap-exec",
    "crates/integration-tests",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/projektbuero/underwrap"

[workspace.dependencies]
underwrap-protocol = { path = "crates/underwrap-protocol" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
tokio = { version = "1", features = ["full"] }
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
clap = { version = "4", features = ["derive"] }
libc = "0.2"
tempfile = "3"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
