[workspace]
resolver = "2"
members = [
    "crates/underwrap-protocol",
    "crates/underwrap-store",
    "crates/underwrapd",
    "crates/underwrap-backendd",
    "crates/underwrapctl",
    "crates/underwrap-exec",
    "crates/underwrap-ns",
    "crates/underwrap-secretsd-store",
    "crates/underwrap-secretsd",
    "crates/integration-tests",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/example/underwrap"

[workspace.dependencies]
underwrap-protocol = { path = "crates/underwrap-protocol" }
underwrap-store = { path = "crates/underwrap-store" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
tokio = { version = "1", features = ["full"] }
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
clap = { version = "4", features = ["derive"] }
libc = "0.2"
tempfile = "3"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "blocking"] }
axum = { version = "0.8", default-features = false, features = ["json", "http1", "tokio"] }
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
bytes = "1"
rustls = "0.23"
tokio-rustls = "0.26"
rustls-pemfile = "2"
x509-parser = "0.17"
chacha20poly1305 = "0.10"
rand = "0.8"
zeroize = { version = "1", features = ["derive"] }
ssh-key = { version = "0.6", features = ["ed25519", "rsa", "std"] }
base64 = "0.22"
hex = "0.4"
signature = "2"
