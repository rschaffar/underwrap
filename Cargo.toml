[workspace]
resolver = "2"
members = [
    "crates/shared-protocol",
    "crates/backend-store",
    "crates/frontend-secretsd-store",
    "crates/frontend-underwrapd",
    "crates/frontend-exec",
    "crates/frontend-ns",
    "crates/frontend-secretsd",
    "crates/debug-tool",
    "crates/frontend-keygen",
    "crates/backend-backendd",
    "crates/integration-tests",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/example/underwrap"

[workspace.dependencies]
shared-protocol = { path = "crates/shared-protocol" }
backend-store = { path = "crates/backend-store" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
tokio = { version = "1", features = ["full"] }
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
clap = { version = "4", features = ["derive"] }
libc = "0.2"
tempfile = "3"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "blocking"] }
axum = { version = "0.8", default-features = false, features = ["json", "http1", "tokio", "matched-path", "tower-log", "query", "macros"] }
tower = { version = "0.5", features = ["util"] }
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio", "server-auto", "service"] }
http-body-util = "0.1"
rustls = "0.23"
tokio-rustls = "0.26"
rustls-pemfile = "2"
sha2 = "0.10"
rcgen = { version = "0.14.8", features = ["x509-parser"] }
chacha20poly1305 = "0.10"
rand = "0.8"
tower-sessions = "0.14"
axum-login = "0.18"
axum_csrf = { version = "0.11", features = ["layer"] }
zeroize = { version = "1", features = ["derive"] }
base64 = "0.22"
hex = "0.4"
utoipa = { version = "5", features = ["axum_extras"] }
utoipa-axum = "0.2"
serde_jcs = "0.2"
